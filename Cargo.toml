[workspace]
resolver = "2"
members = [
    "crates/zkp-core",
    # Kolejne pakiety zostaną odkomentowane w miarę ich tworzenia:
    # "crates/zkp-circuits",
    # "crates/mdoc-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Student Cryptography Project"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Niskopoziomowa arytmetyka ciał skończonych
ark-ff = { version = "0.4.2", default-features = false }
ark-std = { version = "0.4.0", default-features = false }

# Haszowanie kryptograficzne SHA-256
sha2 = "0.10"
digest = "0.10"

# Kody Reeda-Salomona
reed-solomon-novelpoly = "1.0"

# Transkrypt Fiat-Shamir
merlin = "3.0"

# Krzywa NIST P-256 (do wektorów testowych poświadczeń)
p256 = { version = "0.13", features = ["ecdsa", "arithmetic"] }

# Obsługa formatów danych i serializacji
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ciborium = "0.2"
bincode = "1.3"

# CLI
clap = { version = "4.4", features = ["derive"] }

# Lokalne zależności w workspace
zkp-core = { path = "crates/zkp-core" }
zkp-circuits = { path = "crates/zkp-circuits" }
